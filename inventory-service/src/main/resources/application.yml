server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory?connectTimeout=3&socketTimeout=15}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}   # waiting for a connection beyond this fails the request (503) instead of hanging
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/common
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: ${REDIS_TIMEOUT:500ms}              # a hung Redis must cost a request half a second, not a minute
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true     # trace context travels in Kafka record headers
    listener:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      properties:
        # notice topics created by another service within seconds, not the 5-minute default
        metadata.max.age.ms: 10000
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # sample everything locally; lower it (e.g. 0.05) under production load
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  # HS256 shared secret for local/dev/CI. In production leave it empty and set
  # spring.security.oauth2.resourceserver.jwt.issuer-uri (or jwk-set-uri) instead.
  jwt:
    secret: ${JWT_SECRET:}

inventory:
  reservation-ttl: ${INVENTORY_RESERVATION_TTL:PT30M}   # unpaid reservations older than this are released (ISO-8601 duration)
  expiry:
    enabled: ${INVENTORY_EXPIRY_ENABLED:true}
    poll-interval-ms: ${INVENTORY_EXPIRY_POLL_MS:30000}
