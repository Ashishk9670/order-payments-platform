# Local stack. Infra only:           docker compose up -d postgres kafka redis
# Whole platform (builds images):    docker compose --profile apps up --build -d
# Dev-only credentials; never reuse them outside local/CI.
name: order-platform


services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]   # needed only for the optional Debezium CDC profile; harmless otherwise
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  order-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8081:8081"]
    environment:
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}      # tracing is off unless the observability profile is used (see below)
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres:5432/orders
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
      RATELIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT:-120}
      CATALOG_URL: http://catalog-service:8085
      # DEV/CI ONLY: shared HS256 secret and the /dev/token endpoint. In production leave JWT_SECRET empty, set
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI (e.g. the keycloak profile below) and DEV_TOKEN_ENABLED=false.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-dev-only-secret-0123456789}
      DEV_TOKEN_ENABLED: ${DEV_TOKEN_ENABLED:-true}
    depends_on: &infra
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  inventory-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: inventory-service } }
    ports: ["8082:8082"]
    environment:
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}      # tracing is off unless the observability profile is used (see below)
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
    depends_on: *infra

  payment-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: payment-service } }
    ports: ["8083:8083"]
    environment:
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}      # tracing is off unless the observability profile is used (see below)
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres:5432/payments
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-simulated}      # simulated | http (then PSP_URL below is used)
      PSP_URL: ${PSP_URL:-http://psp-mock:8080}
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on: *infra

  api-gateway:
    profiles: [apps]
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}      # tracing is off unless the observability profile is used (see below)
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      ORDER_SERVICE_URL: http://order-service:8081
      REDIS_HOST: redis
      GATEWAY_RATE_REPLENISH: ${GATEWAY_RATE_REPLENISH:-50}
      GATEWAY_RATE_BURST: ${GATEWAY_RATE_BURST:-100}
    depends_on:
      redis: { condition: service_healthy }

  keycloak:
    # Optional real identity provider:  docker compose --profile keycloak up -d keycloak
    # then run order-service with JWT_SECRET= (empty), CUSTOMER_ID_CLAIM=preferred_username and
    # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8180/realms/orders
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes:
      - ./infra/keycloak/realm-orders.json:/opt/keycloak/data/import/realm-orders.json:ro

  catalog-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: catalog-service } }
    ports: ["8085:8085"]
    environment:
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}      # tracing is off unless the observability profile is used (see below)
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres:5432/catalog
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: notification-service } }
    ports: ["8084:8084"]
    environment:
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}      # tracing is off unless the observability profile is used (see below)
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  # ---- observability (optional) --------------------------------------------------------------------------------
  #   TRACING_SAMPLING=1.0 docker compose --profile apps --profile observability up --build -d
  #   Jaeger UI http://localhost:16686   Prometheus http://localhost:9091   Grafana http://localhost:3000 (admin/admin)
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9091:9090"]

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin          # dev only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

  # ---- optional: log-based outbox publishing with Debezium (instead of the polling relay) ------------------------
  #   docker compose --profile cdc up -d kafka-connect
  #   start the apps with OUTBOX_RELAY_ENABLED=false OUTBOX_CDC_ENABLED=true, then: POSTGRES_PASSWORD=postgres scripts/register-debezium.sh
  kafka-connect:
    profiles: [cdc]
    image: quay.io/debezium/connect:3.0
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    ports: ["8089:8083"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ---- optional: a fake card processor (WireMock) to exercise the HTTP payment adapter -------------------------------
  #   PAYMENT_GATEWAY=http docker compose --profile apps --profile psp up -d
  #   amounts: >= 20000 declined | 13.13 -> HTTP 402 | 66.66 -> HTTP 503 (outage) | anything else approved
  psp-mock:
    profiles: [psp]
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./infra/psp-mock:/home/wiremock:ro
    ports: ["9090:8080"]
