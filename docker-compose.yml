# Local stack. Infra only:           docker compose up -d postgres kafka redis
# Whole platform (builds images):    docker compose --profile apps up --build -d
# Dev-only credentials; never reuse them outside local/CI.
name: order-platform


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  order-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
      RATELIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT:-120}
    depends_on: &infra
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  inventory-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: inventory-service } }
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
    depends_on: *infra

  payment-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: payment-service } }
    ports: ["8083:8083"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on: *infra

  notification-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: notification-service } }
    ports: ["8084:8084"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }
