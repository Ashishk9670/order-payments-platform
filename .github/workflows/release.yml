name: Release images

# Publishes one image per service to GitHub Container Registry, but only for commits whose CI run passed
# (workflow_run), or for version tags / manual runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.module }}
    # workflow_run fires for ANY run named CI, including pull requests from forks whose branch happens to be called
    # "main". Publishing needs package-write rights, so only release code that was pushed to THIS repository.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository )
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [api-gateway, order-service, inventory-service, payment-service, catalog-service, notification-service]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=raw,value=sha-${{ env.SHA }}
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
