name: Release images

# Publishes one image per service to GitHub Container Registry, but only for commits whose CI run passed
# (workflow_run), or for version tags / manual runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # keyless cosign signing (OIDC), no long-lived signing key to leak
  security-events: write # Trivy results appear in the Security tab

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.module }}
    # workflow_run fires for ANY run named CI, including pull requests from forks whose branch happens to be called
    # "main". Publishing needs package-write rights, so only release code that was pushed to THIS repository.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository )
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [api-gateway, order-service, inventory-service, payment-service, catalog-service, notification-service, shipping-service]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=raw,value=sha-${{ env.SHA }}
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

      # registry names must be lowercase; github.repository keeps the owner's capitalisation
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.module }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # Scan the exact image that was pushed (by digest). Fixable HIGH/CRITICAL findings fail the job; the "unfixed" ones
      # (no patch exists yet) are ignored so the gate only blocks on things someone can actually do something about.
      # Run the official Trivy image directly (the setup action failed to install the binary on the runner).
      # Pass 1 prints the findings in the job log and never fails; pass 2 writes SARIF and is the gate.
      - name: Scan the image for vulnerabilities (Trivy)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY: docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v ${{ github.workspace }}:/out aquasec/trivy:0.65.0
        run: |
          $TRIVY image --severity HIGH,CRITICAL --ignore-unfixed --format table "$IMAGE" || true
          $TRIVY image --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output /out/trivy-${{ matrix.module }}.sarif "$IMAGE"
          $TRIVY image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /out/.trivyignore --exit-code 1 --quiet "$IMAGE"

      - name: Upload scan results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.module)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.module }}.sarif
          category: trivy-${{ matrix.module }}

      # Sign only images that passed the scan, so "signed" means "scanned and built by this workflow".
      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign the image (keyless)
        run: cosign sign --yes ${{ steps.image.outputs.ref }}
