name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit tests (surefire)
        run: mvn -B -ntp test
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/"

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest   # Docker is preinstalled; Testcontainers starts Postgres, Kafka and Redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Integration tests (failsafe)
        run: mvn -B -ntp verify
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: "**/target/failsafe-reports/"

  e2e:
    name: E2E (Playwright API + UI)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 30
    env:
      RATE_LIMIT: "100000"   # the suite fires many requests from one IP
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the full stack
        run: docker compose --profile apps up --build -d

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for all services to be healthy
        run: ./scripts/wait-for-stack.sh

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Dump service logs on failure
        if: failure()
        run: docker compose --profile apps logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose --profile apps down -v
