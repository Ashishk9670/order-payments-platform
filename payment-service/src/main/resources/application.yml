server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true     # trace context travels in Kafka record headers
    listener:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      properties:
        # notice topics created by another service within seconds, not the 5-minute default
        metadata.max.age.ms: 10000
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # sample everything locally; lower it (e.g. 0.05) under production load
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

payment:
  gateway: ${PAYMENT_GATEWAY:simulated}     # simulated | http
  simulated-limit: ${PAYMENT_SIMULATED_LIMIT:10000}

psp:                                          # used when payment.gateway=http
  url: ${PSP_URL:http://localhost:9090}
  api-key: ${PSP_API_KEY:}                    # secret: provide via environment / secret store, never commit
  timeout-ms: ${PSP_TIMEOUT_MS:3000}

security:
  # HS256 shared secret for local/dev/CI. In production leave it empty and set
  # spring.security.oauth2.resourceserver.jwt.issuer-uri (or jwk-set-uri) instead.
  jwt:
    secret: ${JWT_SECRET:}
