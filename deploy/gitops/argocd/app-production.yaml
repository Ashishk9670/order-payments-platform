apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-platform-production
  namespace: argocd
spec:
  project: order-platform
  source:
    repoURL: https://github.com/Ashishk9670/order-payments-platform.git
    path: deploy/helm/order-platform
    targetRevision: main
    helm:
      valueFiles: [values.yaml, values-production.yaml]
      # image tag: set the commit that CI verified and the release workflow signed, e.g. sha-<40 hex>
      parameters:
        - name: image.tag
          value: "REPLACE_WITH_RELEASED_TAG"
  destination:
    server: https://kubernetes.default.svc
    namespace: order-platform-production
  syncPolicy:
    # production is synced by a person (or a pull request that changes the tag), never automatically
    syncOptions: [CreateNamespace=true]
