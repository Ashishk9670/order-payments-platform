{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "op.fullname" $ctx }}
  labels:
    {{- include "op.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "op.selectorLabels" $ctx | nindent 4 }}
  ports:
    - { name: http, port: {{ $svc.port }}, targetPort: http }
{{- end }}
