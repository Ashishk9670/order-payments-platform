{{- range $name, $svc := .Values.services }}
{{- if and $svc.autoscaling $svc.autoscaling.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "op.fullname" $ctx }}
  labels:
    {{- include "op.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "op.fullname" $ctx }} }
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
