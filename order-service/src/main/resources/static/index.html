<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Platform</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --on-accent:#fff;
            --ok:#067647; --okbg:#ecfdf3; --bad:#b42318; --badbg:#fef3f2; --wait:#93370d; --waitbg:#fffaeb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#171a21; --ink:#e8eaed; --muted:#98a2b3; --line:#2a2f3a; --accent:#6b9bff; --on-accent:#0b1220;
              --ok:#6ce9a6; --okbg:#0b2e1f; --bad:#fda29b; --badbg:#3a1410; --wait:#fec84b; --waitbg:#3a2a07; } }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:880px; margin:0 auto; padding:24px 16px 64px; display:grid; gap:20px; }
    h1 { font-size:22px; margin:0; } h2 { font-size:16px; margin:0 0 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
    input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    button { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
    .PENDING, .INVENTORY_RESERVED, .REFUND_PENDING { background:var(--waitbg); color:var(--wait); }
    .CONFIRMED { background:var(--okbg); color:var(--ok); }
    .CANCELLED { background:var(--badbg); color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:14px; } th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; } code { font-size:12px; color:var(--muted); }
    .error { color:var(--bad); margin-top:10px; } .muted { color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Order Platform</h1>

  <section class="card" aria-labelledby="place-h">
    <h2 id="place-h">Place an order</h2>
    <form id="order-form" novalidate>
      <div class="grid">
        <div><label for="customerId">Customer ID</label><input id="customerId" name="customerId" value="demo-customer" data-testid="customer-id"></div>
        <div><label for="sku">Product</label>
          <select id="sku" name="sku" data-testid="sku"></select></div>
        <div><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="1" value="1" data-testid="quantity"></div>
        <div><label>Estimated total</label><div id="estimate" class="muted" data-testid="estimate" style="padding:9px 0">-</div></div>
      </div>
      <div class="row">
        <button class="primary" type="submit" id="submit" data-testid="place-order">Place order</button>
        <button type="button" id="preset-decline" data-testid="preset-decline" title="Gold-plated widget: total above the simulated card limit of 10000">Preset: payment will be declined</button>
      </div>
      <p class="muted" style="margin:10px 0 0;font-size:13px">Prices come from the catalog service; the server prices every order.</p>
      <div id="form-error" class="error" role="alert" data-testid="form-error" hidden></div>
    </form>
  </section>

  <section class="card" id="result-card" aria-live="polite" hidden>
    <h2>Latest order</h2>
    <p>
      <span id="result-status" class="badge" data-testid="order-status"></span>
      <code id="result-id" data-testid="order-id"></code>
      <span id="live" class="muted" data-testid="live-indicator" style="font-size:12px"></span>
    </p>
    <p id="result-total" class="muted" data-testid="order-total"></p>
    <p id="result-reason" class="error" data-testid="order-reason" hidden></p>
    <div class="row" style="margin-top:0">
      <button type="button" id="cancel-order" data-testid="cancel-order" hidden>Cancel order (refund)</button>
    </div>
  </section>

  <section class="card" aria-labelledby="history-h">
    <h2 id="history-h">Order history <span class="muted">(GraphQL)</span></h2>
    <div class="row" style="margin-top:0;margin-bottom:12px">
      <button type="button" id="refresh" data-testid="refresh-history">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Order</th><th>Status</th><th>Items</th><th>Total</th></tr></thead>
      <tbody id="history" data-testid="history"></tbody>
    </table>
    <p id="history-empty" class="muted" data-testid="history-empty" hidden>No orders yet for this customer.</p>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const TERMINAL = new Set(['CONFIRMED', 'CANCELLED']);
  let current = null;      // latest order being tracked
  let tracker = null;      // AbortController of the live stream / polling
  let products = [];

  // ---- auth: the API needs a bearer token. This demo gets one from the dev-only /dev/token endpoint; with a real
  // identity provider (Keycloak) the login redirect would replace tokenFor(). Tokens are cached per customer.
  const tokens = new Map();
  const customer = () => $('customerId').value.trim();
  async function tokenFor(customerId) {
    if (!tokens.has(customerId)) {
      const r = await fetch('/dev/token', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId }) });
      if (!r.ok) throw new Error('sign-in unavailable');
      tokens.set(customerId, (await r.json()).token);
    }
    return tokens.get(customerId);
  }
  async function api(url, opts = {}, customerId = customer()) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const token = await tokenFor(customerId);
      const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
      if (r.status !== 401) return r;
      tokens.delete(customerId);   // expired or revoked: sign in again once
    }
    throw new Error('not authorized');
  }

  // ---- catalog -----------------------------------------------------------------------------------------------
  async function loadProducts() {
    try {
      const r = await api('/api/v1/products');
      if (!r.ok) throw new Error(String(r.status));
      products = await r.json();
    } catch (e) { products = []; }
    const sel = $('sku');
    sel.replaceChildren(...products.map((p) => option(p.sku, `${p.sku} - ${p.name} (${Number(p.price).toFixed(2)})`)),
      option('SKU-UNKNOWN', 'SKU-UNKNOWN (not in catalog)'));
    updateEstimate();
  }
  function option(value, label) { const o = document.createElement('option'); o.value = value; o.textContent = label; return o; }
  function updateEstimate() {
    const p = products.find((x) => x.sku === $('sku').value);
    const q = parseInt($('quantity').value, 10);
    $('estimate').textContent = p && q >= 1 ? (p.price * q).toFixed(2) : '-';
  }
  $('sku').addEventListener('change', updateEstimate);
  $('quantity').addEventListener('input', updateEstimate);

  // ---- rendering -----------------------------------------------------------------------------------------------
  function render(o) {
    current = { ...current, ...o };
    $('result-card').hidden = false;
    $('result-status').textContent = current.status;
    $('result-status').className = 'badge ' + current.status;
    $('result-id').textContent = current.id;
    if (current.totalAmount != null) $('result-total').textContent = 'Total: ' + Number(current.totalAmount).toFixed(2);
    $('result-reason').hidden = !current.cancelReason;
    $('result-reason').textContent = current.cancelReason ? 'Reason: ' + current.cancelReason : '';
    $('cancel-order').hidden = current.status !== 'CONFIRMED';
  }

  // ---- live status: GraphQL subscription over SSE, polling as a fallback ----------------------------------------------
  async function track(id) {
    if (tracker) tracker.abort();
    const ctrl = (tracker = new AbortController());
    $('live').textContent = '';
    try {
      await subscribe(id, ctrl.signal, (u) => { render(u); });
      $('live').textContent = '';
    } catch (e) {
      if (ctrl.signal.aborted) return;
      $('live').textContent = '(polling)';
      await poll(id, ctrl.signal);
    }
    if (!ctrl.signal.aborted) loadHistory();
  }

  async function subscribe(id, signal, onUpdate) {
    const r = await api('/graphql', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
      body: JSON.stringify({ query: 'subscription($id:ID!){ orderStatusChanged(id:$id){ id status cancelReason } }', variables: { id } })
    }, current.customerId);
    if (!r.ok || !r.body) throw new Error('stream unavailable');
    $('live').textContent = '(live)';
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const event = (block.match(/^event: *(.*)$/m) || [])[1];
        const data = block.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
        if (event === 'next' && data) {
          const payload = JSON.parse(data);
          if (payload.errors) throw new Error('subscription error');
          onUpdate(payload.data.orderStatusChanged);
        } else if (event === 'complete') return;
      }
    }
  }

  async function poll(id, signal) {
    while (!signal.aborted) {
      try {
        const r = await api('/api/v1/orders/' + id, { signal }, current.customerId);
        if (r.ok) { const o = await r.json(); render(o); if (TERMINAL.has(o.status)) return; }
      } catch (e) { if (signal.aborted) return; }
      await new Promise((res) => setTimeout(res, 700));
    }
  }

  // ---- history (GraphQL query) -------------------------------------------------------------------------------------
  async function loadHistory() {
    const customerId = $('customerId').value.trim();
    if (!customerId) return;
    const query = `query($c:String!){ ordersByCustomer(customerId:$c){ id status totalAmount items{ sku quantity } } }`;
    const r = await api('/graphql', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables: { c: customerId } }) }, customerId);
    const body = await r.json();
    const orders = (body.data && body.data.ordersByCustomer) || [];
    $('history-empty').hidden = orders.length > 0;
    $('history').replaceChildren(...orders.map((o) => {
      const tr = document.createElement('tr');
      tr.setAttribute('data-testid', 'history-row');
      tr.append(cell(o.id.slice(0, 8), 'code'), badgeCell(o.status),
        cell(o.items.map((i) => i.quantity + '\u00d7 ' + i.sku).join(', ')), cell(Number(o.totalAmount).toFixed(2)));
      return tr;
    }));
  }
  function cell(text, tag) { const td = document.createElement('td'); if (tag) { const el = document.createElement(tag); el.textContent = text; td.append(el); } else td.textContent = text; return td; }
  function badgeCell(status) { const td = document.createElement('td'); const s = document.createElement('span'); s.className = 'badge ' + status; s.textContent = status; td.append(s); return td; }

  // ---- actions -----------------------------------------------------------------------------------------------------
  function fail(msg) { const e = $('form-error'); e.textContent = msg; e.hidden = false; $('submit').disabled = false; }

  $('order-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('form-error').hidden = true;
    const qty = parseInt($('quantity').value, 10);
    if (!$('customerId').value.trim()) return fail('Customer ID is required');
    if (!(qty >= 1)) return fail('Quantity must be at least 1');

    $('submit').disabled = true;
    try {
      const r = await api('/api/v1/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': crypto.randomUUID() },
        body: JSON.stringify({ customerId: $('customerId').value.trim(), items: [{ sku: $('sku').value, quantity: qty }] })
      });
      if (!r.ok) { const p = await r.json().catch(() => ({})); return fail(p.detail || p.title || ('Request failed: ' + r.status)); }
      const order = await r.json();
      current = null;
      render(order);
      track(order.id);
    } catch (e) { fail(e.message === 'sign-in unavailable' ? 'Sign-in is unavailable: no identity provider configured' : 'Network error'); }
    finally { $('submit').disabled = false; }
  });

  $('cancel-order').addEventListener('click', async () => {
    $('cancel-order').disabled = true;
    try {
      const r = await api('/api/v1/orders/' + current.id + '/cancel', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: 'requested from storefront' })
      }, current.customerId);
      if (!r.ok) { const p = await r.json().catch(() => ({})); return fail(p.detail || 'Cancel failed'); }
      render(await r.json());
      track(current.id);
    } finally { $('cancel-order').disabled = false; }
  });

  $('preset-decline').addEventListener('click', () => {
    $('sku').value = 'SKU-LUXURY'; $('quantity').value = 1; updateEstimate();
  });
  $('refresh').addEventListener('click', loadHistory);
  $('customerId').addEventListener('change', loadHistory);
  loadProducts();
  loadHistory();
</script>
</body>
</html>
