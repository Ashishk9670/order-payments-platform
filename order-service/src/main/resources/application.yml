server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/common
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 30s
      key-prefix: "order-service::"
      # catalog-price entries live as long as the default TTL (30s): a price change is visible within 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true     # trace context travels in Kafka record headers
    listener:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      properties:
        # notice topics created by another service within seconds, not the 5-minute default
        metadata.max.age.ms: 10000
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  graphql:
    graphiql:
      enabled: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # sample everything locally; lower it (e.g. 0.05) under production load
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  # HS256 shared secret for local/dev/CI. In production leave it empty and set
  # spring.security.oauth2.resourceserver.jwt.issuer-uri (e.g. Keycloak) instead.
  jwt:
    secret: ${JWT_SECRET:}
  customer-id-claim: ${CUSTOMER_ID_CLAIM:sub}
  dev-token:
    enabled: ${DEV_TOKEN_ENABLED:false}   # DEV/CI ONLY: POST /dev/token mints tokens

catalog:
  url: ${CATALOG_URL:http://localhost:8085}
  timeout-ms: 2000
