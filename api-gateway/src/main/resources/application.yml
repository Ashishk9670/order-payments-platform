server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: ${REDIS_TIMEOUT:500ms}              # a hung Redis must cost a request half a second, not a minute
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

gateway:
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  rate-limit:
    replenish-per-second: ${GATEWAY_RATE_REPLENISH:50}
    burst: ${GATEWAY_RATE_BURST:100}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # sample everything locally; lower it (e.g. 0.05) under production load
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
